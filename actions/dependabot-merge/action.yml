name: Merge verified Dependabot update
description: >-
  Squash-merge a Dependabot pull request after its checks passed in the same run. Majors, pre-1.0 minors
  and pre-releases stay manual. The merge commit is verified again by dispatching the caller workflow on
  the default branch, because merges made with the workflow token do not trigger push runs.

runs:
  using: composite
  steps:
    - id: metadata
      uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3

    - name: Merge patch and stable minor updates
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.html_url }}
        HEAD: ${{ github.event.pull_request.head.sha }}
        BRANCH: ${{ github.event.repository.default_branch }}
        UPDATE: ${{ steps.metadata.outputs.update-type }}
        DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
      run: |
        manual=$(jq -r '[.[] | select(
            (.newVersion // "" | test("-")) or
            (.updateType == "version-update:semver-minor" and (.prevVersion // "0" | test("^v?0\\.")))
          )] | length' <<< "$DEPENDENCIES")
        case "$UPDATE" in
          version-update:semver-patch|version-update:semver-minor) ;;
          *) manual=1 ;;
        esac
        if [ "$manual" != 0 ]; then
          echo "::notice::$UPDATE needs a manual review."
          exit 0
        fi
        gh pr merge "$PR" --squash --match-head-commit "$HEAD"
        workflow="${GITHUB_WORKFLOW_REF#*/.github/workflows/}"
        gh workflow run "${workflow%%@*}" --ref "$BRANCH"
