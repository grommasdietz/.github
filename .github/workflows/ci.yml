name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint workflows and actions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate workflows
        run: docker run --rm --network none --volume "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify Composer compatibility setup
        run: python3 -B tests/test-composer-setup.py
      - name: Check formatting
        run: npx --yes prettier@3.6.2 --check '**/*.{yml,yaml,md}'

  compatibility-setup:
    name: Exercise real Kirby overrides
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create independent root and playground runtime fixtures
        run: |
          mkdir playground
          printf '%s\n' '{"require-dev":{"getkirby/cms":"^5.6"},"config":{"allow-plugins":{"getkirby/composer-installer":true}}}' > composer.json
          printf '%s\n' '{"require":{"getkirby/cms":"^5.6"},"config":{"allow-plugins":{"getkirby/composer-installer":true}}}' > playground/composer.json
      - uses: ./actions/setup
        with:
          php: '8.3'
          kirby: '6.0.0-rc.1'
          node: 'false'
      - name: Assert both installed runtimes use the requested Kirby
        run: |
          php -r 'require "vendor/autoload.php"; if (Composer\InstalledVersions::getPrettyVersion("getkirby/cms") !== "6.0.0-rc.1") exit(1);'
          php -r 'require "playground/vendor/autoload.php"; if (Composer\InstalledVersions::getPrettyVersion("getkirby/cms") !== "6.0.0-rc.1") exit(1);'
