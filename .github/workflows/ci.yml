name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint workflows and actions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate workflows
        run: docker run --rm --network none --volume "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color
      - name: Check formatting
        run: npx --yes prettier@3.6.2 --check '**/*.{yml,yaml,md}'
